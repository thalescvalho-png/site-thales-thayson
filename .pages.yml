# Configuração do painel de edição (Pages CMS - https://app.pagescms.org)
# Define quais campos aparecem no painel. Não precisa mexer aqui para editar o site.

media:
  input: img
  output: img

content:
  - name: site
    label: Conteúdo do site
    type: file
    path: content/site.json
    format: json
    fields:
      - name: nome
        label: Nome da dupla
        type: string
      - name: chamada
        label: Frase de abertura
        type: string
      - name: foto_capa
        label: Foto de capa (topo do site)
        type: image

      - name: historia
        label: História
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - name: texto
            label: Texto
            type: text
            description: Deixe uma linha em branco entre um parágrafo e outro.

      - name: musicas
        label: Músicas
        type: object
        list: true
        fields:
          - { name: titulo, label: Nome da música, type: string }
          - { name: artista, label: Artista, type: string }
          - { name: descricao, label: Descrição, type: text }
          - name: link
            label: Link (Spotify, YouTube etc.)
            type: string
            description: Link do Spotify vira player automaticamente.

      - name: lancamento
        label: Próximo lançamento
        type: object
        fields:
          - { name: titulo, label: Título, type: string, description: Deixe vazio para esconder esta seção. }
          - { name: subtitulo, label: Subtítulo, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: imagem, label: Imagem, type: image }

      - name: trajetoria
        label: Trajetória (linha do tempo)
        type: object
        list: true
        fields:
          - { name: ano, label: Ano, type: string }
          - { name: titulo, label: Evento, type: string }
          - { name: descricao, label: Descrição, type: text }

      - name: raizes
        label: Raízes no rock
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text, description: Deixe vazio para esconder esta seção. }

      - name: galeria
        label: Galeria de fotos
        type: object
        list: true
        fields:
          - { name: imagem, label: Foto, type: image }
          - { name: legenda, label: Legenda, type: string }

      - name: contato
        label: Contato
        type: object
        fields:
          - { name: texto, label: Texto, type: string }
          - { name: email, label: E-mail, type: string }
          - { name: instagram, label: Link do Instagram, type: string }
          - { name: spotify, label: Link do Spotify (perfil), type: string }
          - { name: youtube, label: Link do YouTube, type: string }
